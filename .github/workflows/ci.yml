name: Test and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q agents serum.py osmolality.py cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Verify editable CLI
        run: serum-osmolality calculate --sodium 140 --glucose 90 --bun 14
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check web/calculator.js
          node --check web/app.js
      - name: Run client-side calculation tests
        run: node --test tests/browser.test.cjs
      - name: Confirm Pages entry point and resources
        run: |
          test -s web/index.html
          test -s web/calculator.js
          test -s web/app.js
